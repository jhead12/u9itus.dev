name: Refresh Candidate News

# Runs every 6 hours and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      stale_hours:
        description: "Treat news older than N hours as stale"
        default: "6"
        required: false
      limit:
        description: "Max candidates to refresh per run"
        default: "100"
        required: false
      states:
        description: "Comma-separated state codes to refresh (e.g. CA,TX,NY). Leave blank for all states."
        default: ""
        required: false
      dry_run:
        description: "Dry-run (report only, no fetching)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh-news:
    name: Fetch candidate headlines
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── PHP ─────────────────────────────────────────────────────────────────
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      # ── Composer ────────────────────────────────────────────────────────────
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      # ── Laravel env ─────────────────────────────────────────────────────────
      # All secrets are set in GitHub → Settings → Secrets → Actions.
      # Required: APP_KEY, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      # Optional: NEWSAPI_KEY, GNEWS_API_KEY
      - name: Write .env
        run: |
          cat > .env <<EOF
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          NEWSAPI_KEY=${{ secrets.NEWSAPI_KEY }}
          GNEWS_API_KEY=${{ secrets.GNEWS_API_KEY }}

          CACHE_DRIVER=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr
          EOF

      # ── Run migrations (only new ones; safe to run on every job) ─────────────
      - name: Debug migration source
        run: |
          echo "Workflow SHA: $GITHUB_SHA"
          git rev-parse HEAD
          echo "--- migration guard check (profile_photo_status) ---"
          grep -n "hasColumn('politicians', 'profile_photo_status')\|profile_photo_status" \
            database/migrations/2026_07_06_120001_add_photo_validation_and_news_verification_fields.php || true

      - name: Run pending migrations
        run: php artisan migrate --force --no-interaction

      # ── Refresh news ─────────────────────────────────────────────────────────
      - name: Refresh candidate news
        run: |
          STALE=${{ github.event.inputs.stale_hours || '6' }}
          LIMIT=${{ github.event.inputs.limit || '50' }}
          STATES="${{ github.event.inputs.states }}"
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          if [ -z "$STATES" ]; then
            php artisan candidates:refresh-news \
              --stale-hours="${STALE}" \
              --limit="${LIMIT}" \
              ${DRY}
          else
            # candidates:refresh-news only accepts one --state per invocation,
            # so a multi-state run (e.g. from the hot-state map dispatcher)
            # loops here instead of only refreshing the first state.
            for state in $(echo "$STATES" | tr ',' ' '); do
              php artisan candidates:refresh-news \
                --stale-hours="${STALE}" \
                --limit="${LIMIT}" \
                --state="$state" \
                ${DRY}
            done
          fi

      # ── Verify + clean news relevance (candidate name/context gate) ───────
      - name: Verify candidate news relevance
        run: |
          LIMIT=${{ github.event.inputs.limit || '100' }}
          STATES="${{ github.event.inputs.states }}"
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          if [ -z "$STATES" ]; then
            php artisan candidates:verify-news \
              --limit="${LIMIT}" \
              ${DRY}
          else
            for state in $(echo "$STATES" | tr ',' ' '); do
              php artisan candidates:verify-news \
                --limit="${LIMIT}" \
                --state="$state" \
                ${DRY}
            done
          fi
