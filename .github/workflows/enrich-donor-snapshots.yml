name: Enrich Donor Snapshots

# Runs nightly at 03:00 UTC and can be triggered manually.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max politicians to enrich per run"
        default: "200"
        required: false
      stale_hours:
        description: "Re-enrich snapshots older than N hours"
        default: "48"
        required: false
      politician:
        description: "Single politician ID or slug (leave blank for batch)"
        default: ""
        required: false
      force:
        description: "Force re-enrich even if snapshot is fresh"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (report only, no DB writes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enrich-donors:
    name: Fetch donor/sponsor snapshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up app
        uses: ./.github/actions/setup-app
        with:
          app_key: ${{ secrets.APP_KEY }}
          app_url: ${{ secrets.APP_URL }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_username: ${{ secrets.DB_USERNAME }}
          db_password: ${{ secrets.DB_PASSWORD }}
          fec_api_key: ${{ secrets.FEC_API_KEY }}

      - name: Set up Node + Playwright
        uses: ./.github/actions/setup-node-playwright

      - name: Enrich donor snapshots
        run: |
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          STALE="${{ github.event.inputs.stale_hours || '48' }}"
          POL="${{ github.event.inputs.politician || '' }}"
          FORCE=${{ github.event.inputs.force == 'true' && '--force' || '' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          POL_ARG=""
          if [ -n "$POL" ]; then POL_ARG="--politician=$POL"; fi

          php artisan politicians:enrich-donors \
            --limit="${LIMIT}" \
            --stale-hours="${STALE}" \
            ${POL_ARG} \
            ${FORCE} \
            ${DRY}
