name: Prep Upcoming-Election Candidates

# Prioritizes candidates currently on the ballot (is_running_candidate=true):
# tags primary losers (state + federal), discovers missing campaign websites,
# then refreshes news/finance/video coverage for that same target set — so a
# brand-new candidate isn't waiting behind high-traffic incumbents in the
# default staleness/traffic queues. Runs daily and can be triggered manually.
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC — after sync-candidates (02:00)
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes to scope sync-primary-results/refresh-news (e.g. CA,TX,NY). Leave blank for all states."
        default: ""
        required: false
      limit:
        description: "Max candidates to process per step"
        default: "200"
        required: false
      dry_run:
        description: "Dry-run (report only, no writes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prep-upcoming-candidates:
    name: Tag primary losers, discover sites, refresh news/finance/video
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── App setup (PHP, Composer, .env, migrate) ─────────────────────────────
      # Required secrets: APP_KEY, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      # Optional secrets: NEWSAPI_KEY, GNEWS_API_KEY
      - name: Set up app
        uses: ./.github/actions/setup-app
        with:
          app_key: ${{ secrets.APP_KEY }}
          app_url: ${{ secrets.APP_URL }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_username: ${{ secrets.DB_USERNAME }}
          db_password: ${{ secrets.DB_PASSWORD }}
          newsapi_key: ${{ secrets.NEWSAPI_KEY }}
          gnews_api_key: ${{ secrets.GNEWS_API_KEY }}

      # ── 1. Tag primary losers (now covers state + federal) ──────────────────
      - name: Sync primary results
        run: |
          STATES="${{ github.event.inputs.states }}"
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          if [ -z "$STATES" ]; then
            php artisan politicians:sync-primary-results --force ${DRY}
          else
            for state in $(echo "$STATES" | tr ',' ' '); do
              php artisan politicians:sync-primary-results --state="$state" --force ${DRY}
            done
          fi

      # ── 2. Discover missing campaign websites for running candidates ────────
      - name: Discover campaign websites
        run: |
          LIMIT=${{ github.event.inputs.limit || '200' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          php artisan politicians:discover-websites --limit="${LIMIT}" ${DRY}

      # ── 3. Enrich profiles now that newly-discovered sites are set ──────────
      - name: Enrich candidate profiles
        run: |
          LIMIT=${{ github.event.inputs.limit || '200' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          php artisan politicians:enrich-profiles --limit="${LIMIT}" --force ${DRY}

      # ── 4. News, prioritized for the upcoming-cycle candidate set ───────────
      - name: Refresh candidate news
        run: |
          LIMIT=${{ github.event.inputs.limit || '200' }}
          STATES="${{ github.event.inputs.states }}"
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          if [ -z "$STATES" ]; then
            php artisan candidates:refresh-news --limit="${LIMIT}" --upcoming-only ${DRY}
          else
            for state in $(echo "$STATES" | tr ',' ' '); do
              php artisan candidates:refresh-news --limit="${LIMIT}" --state="$state" --upcoming-only ${DRY}
            done
          fi

      # ── 5. Campaign finance, prioritized for the upcoming-cycle candidate set ─
      - name: Enrich donor/finance data
        run: |
          LIMIT=${{ github.event.inputs.limit || '200' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          php artisan politicians:enrich-donors --limit="${LIMIT}" --upcoming-only --force ${DRY}

      # ── 6. C-SPAN video coverage, prioritized for the upcoming-cycle set ────
      - name: Enrich C-SPAN moments
        run: |
          LIMIT=${{ github.event.inputs.limit || '200' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          php artisan politicians:enrich-cspan-moments --limit="${LIMIT}" --upcoming-only ${DRY}

      # ── 7. Reconcile status (catches any post-general changes) ─────────────
      - name: Reconcile politician status
        run: |
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          php artisan politicians:reconcile-status ${DRY}
