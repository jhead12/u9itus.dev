name: Refresh Viral Moments

# Runs every 6 hours and can be triggered manually. Populates
# politician_viral_moments + the denormalized politicians.featured_moment_*
# columns from YouTube Data API view counts (scored by MomentScoreService).
on:
  schedule:
    - cron: "7 */6 * * *"   # :07 past the hour — off the :00 fleet stampede
  workflow_dispatch:
    inputs:
      limit:
        description: "Max politicians to enrich per run"
        default: "200"
        required: false
      stale_hours:
        description: "Re-enrich moments older than N hours"
        default: "48"
        required: false
      politician:
        description: "Single politician ID or slug (leave blank for batch)"
        default: ""
        required: false
      force:
        description: "Force re-enrich even if fresh, and skip the news-freshness gate"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (report only, no DB writes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enrich-moments:
    name: Fetch + score viral-moment clips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up app
        uses: ./.github/actions/setup-app
        with:
          app_key: ${{ secrets.APP_KEY }}
          app_url: ${{ secrets.APP_URL }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_username: ${{ secrets.DB_USERNAME }}
          db_password: ${{ secrets.DB_PASSWORD }}
          youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Enrich viral moments
        run: |
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          STALE="${{ github.event.inputs.stale_hours || '48' }}"
          POL="${{ github.event.inputs.politician || '' }}"
          FORCE=${{ github.event.inputs.force == 'true' && '--force' || '' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          POL_ARG=""
          if [ -n "$POL" ]; then POL_ARG="--politician=$POL"; fi

          php artisan politicians:enrich-moments \
            --limit="${LIMIT}" \
            --stale-hours="${STALE}" \
            ${POL_ARG} \
            ${FORCE} \
            ${DRY}