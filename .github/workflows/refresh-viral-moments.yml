name: Refresh Viral Moments

# Runs every 6 hours and can be triggered manually. Populates
# politician_viral_moments + the denormalized politicians.featured_moment_*
# columns from YouTube Data API view counts (scored by MomentScoreService).
on:
  schedule:
    - cron: "7 */6 * * *"   # :07 past the hour — off the :00 fleet stampede
  workflow_dispatch:
    inputs:
      limit:
        description: "Max politicians to enrich per run"
        default: "200"
        required: false
      stale_hours:
        description: "Re-enrich moments older than N hours"
        default: "48"
        required: false
      politician:
        description: "Single politician ID or slug (leave blank for batch)"
        default: ""
        required: false
      force:
        description: "Force re-enrich even if fresh, and skip the news-freshness gate"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (report only, no DB writes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enrich-moments:
    name: Fetch + score viral-moment clips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Write .env
        run: |
          cat > .env <<EOF
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}

          CACHE_DRIVER=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr
          EOF

      - name: Run pending migrations
        run: php artisan migrate --force --no-interaction

      - name: Enrich viral moments
        run: |
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          STALE="${{ github.event.inputs.stale_hours || '48' }}"
          POL="${{ github.event.inputs.politician || '' }}"
          FORCE=${{ github.event.inputs.force == 'true' && '--force' || '' }}
          DRY=${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          POL_ARG=""
          if [ -n "$POL" ]; then POL_ARG="--politician=$POL"; fi

          php artisan politicians:enrich-moments \
            --limit="${LIMIT}" \
            --stale-hours="${STALE}" \
            ${POL_ARG} \
            ${FORCE} \
            ${DRY}