name: Sync Candidates

# Runs weekly (Sunday 02:00 UTC) and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes to sync (e.g. CA,TX,NY). Leave blank for all states."
        default: ""
        required: false
      include_former:
        description: "Include politicians whose latest term has ended"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (report only, no DB writes)"
        type: boolean
        default: false
      election_year:
        description: "Election year to target for result scraping (default: 2026)"
        default: "2026"
        required: false
      include_results:
        description: "Also scrape election results (winner/loser) from Ballotpedia + local sites"
        type: boolean
        default: true
      create_missing:
        description: "Create new unclaimed profiles for candidates not yet in the DB"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-federal-candidates:
    name: Sync federal candidates from congress-legislators
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── PHP ─────────────────────────────────────────────────────────────────
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      # ── Composer ────────────────────────────────────────────────────────────
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      # ── Laravel env ─────────────────────────────────────────────────────────
      # Required secrets: APP_KEY, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      # Optional secrets: STRIPE_SECRET, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY
      - name: Write .env
        run: |
          cat > .env <<EOF
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr

          STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}
          STRIPE_KEY=${{ secrets.STRIPE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF

      # ── Migrations ───────────────────────────────────────────────────────────
      - name: Run pending migrations
        run: php artisan migrate --force --no-interaction

      # ── Build state filter args ──────────────────────────────────────────────
      - name: Build import arguments
        id: args
        run: |
          STATES="${{ github.event.inputs.states }}"
          STATE_ARGS=""
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              STATE_ARGS="$STATE_ARGS --state=$state"
            done
          fi

          FORMER_ARG=""
          if [ "${{ github.event.inputs.include_former }}" = "true" ]; then
            FORMER_ARG="--include-former"
          fi

          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          echo "state_args=$STATE_ARGS" >> $GITHUB_OUTPUT
          echo "former_arg=$FORMER_ARG" >> $GITHUB_OUTPUT
          echo "dry_arg=$DRY_ARG" >> $GITHUB_OUTPUT

      # ── Sync current federal legislators ─────────────────────────────────────
      - name: Sync current federal legislators
        run: |
          php artisan politicians:import-unclaimed-us \
            --fetcher=current \
            ${{ steps.args.outputs.state_args }} \
            ${{ steps.args.outputs.former_arg }} \
            ${{ steps.args.outputs.dry_arg }}

      # ── Sync California-specific federal profiles ─────────────────────────────
      - name: Sync California federal profiles (dedicated command)
        run: |
          php artisan politicians:import-unclaimed-ca \
            ${{ steps.args.outputs.dry_arg }}

      # ── Scrape & import 2026 primary candidates from Ballotpedia ─────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Verify Playwright installation
        run: node -e "import('playwright').then(m => console.log('playwright OK:', Object.keys(m)))"

      # ── Statewide offices (direct strategy: constructs per-state URLs) ──────
      # Uses --strategy=direct so every state's race page is visited directly:
      #   https://ballotpedia.org/{StateName}_gubernatorial_election,_{year}
      #   https://ballotpedia.org/{StateName}_attorney_general_election,_{year}
      #   https://ballotpedia.org/{StateName}_lieutenant_gubernatorial_election,_{year}
      #   ... etc.
      # This is more reliable than the index approach — guaranteed to attempt
      # all 50 states regardless of whether Ballotpedia's index page lists them.
      - name: Scrape Ballotpedia statewide candidates (all 50 states, direct)
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATE_ARG=""
          if [ -n "${{ github.event.inputs.states }}" ]; then
            # single-state runs pass the first state only (direct mode takes --state)
            FIRST_STATE=$(echo "${{ github.event.inputs.states }}" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST_STATE"
          fi
          node scripts/scrape-ballotpedia.js \
            --office=statewide \
            --strategy=direct \
            --year="$YEAR" \
            $STATE_ARG \
            --results \
            --out=storage/app/imports/ballotpedia-statewide-${YEAR}.json

      - name: Import statewide candidates
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          php artisan politicians:import-ballotpedia \
            --file=storage/app/imports/ballotpedia-statewide-${YEAR}.json \
            ${{ steps.args.outputs.dry_arg }}

      # ── U.S. House races (index strategy: multi-district per state) ──────────
      - name: Scrape Ballotpedia U.S. House candidates
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          node scripts/scrape-ballotpedia.js \
            --office=house \
            --strategy=index \
            --year="$YEAR" \
            ${{ steps.args.outputs.state_args }} \
            --out=storage/app/imports/ballotpedia-house-${YEAR}.json

      - name: Import U.S. House candidates
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          php artisan politicians:import-ballotpedia \
            --file=storage/app/imports/ballotpedia-house-${YEAR}.json \
            ${{ steps.args.outputs.dry_arg }}

      # ── Sync Census Bureau population data ───────────────────────────────
      # Upserts state + congressional-district populations from the
      # 2020 Decennial Census P.L. 94-171 redistricting file (free API,
      # no key required). Run in dry-run mode when the workflow is dry-run.
      - name: Sync Census population data
        env:
          CENSUS_DATA_API: ${{ secrets.CENSUS_DATA_API }}
        run: |
          php artisan geo:sync-census-population \
            --year=2020 \
            --level=all \
            ${{ steps.args.outputs.dry_arg }}

      # ── AI-enriched statewide officeholder data ──────────────────────────
      # Three-tier pipeline: Ballotpedia → Wikipedia → Claude (if key set).
      # Syncs current governor, lt. governor, attorney general, treasurer,
      # and secretary of state for every state (or the filtered subset).
      # --clean removes unverified statewide records not matched by enrichment
      # (eliminates garbage scraper rows like "Linda Martinez").
      - name: Enrich statewide officeholders
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # enrich-statewide accepts a single --state flag; when multiple states
          # are requested we loop; when no filter is set it runs all 50 states.
          STATES="${{ github.event.inputs.states }}"
          DRY="${{ steps.args.outputs.dry_arg }}"
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              echo "=== Enriching statewide offices for $state ==="
              php artisan politicians:enrich-statewide \
                --state="$state" \
                --clean \
                $DRY
            done
          else
            php artisan politicians:enrich-statewide \
              --clean \
              $DRY
          fi

      # ── Sync primary election results ────────────────────────────────────
      # For each statewide candidate whose election_date is in the past,
      # scrapes Ballotpedia/Wikipedia to determine if they advanced to the
      # general or were eliminated. Stamps payload.primary_result.
      # Eliminated candidates are then hidden from the map API automatically.
      - name: Sync primary results
        run: |
          STATES="${{ github.event.inputs.states }}"
          DRY="${{ steps.args.outputs.dry_arg }}"
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              echo "=== Syncing primary results for $state ==="
              php artisan politicians:sync-primary-results \
                --state="$state" \
                $DRY
            done
          else
            php artisan politicians:sync-primary-results $DRY
          fi

      # ── Reconcile lifecycle status ────────────────────────────────────────
      # Marks seated members, retires former members, and clears stale
      # is_running_candidate flags after an election date has passed.
      - name: Reconcile politician status
        run: |
          php artisan politicians:reconcile-status \
            ${{ steps.args.outputs.dry_arg }}

      # ── Election results & local voter guides (all 50 states) ────────────
      # Two-pass results enrichment:
      #  Pass 1 — Re-scrape Ballotpedia with --results to capture winner/loser
      #            flags from the same pages already visited for candidates.
      #  Pass 2 — Scrape per-state local voter guide / news sites using the
      #            50-state map in scripts/scrape-state-voter-guides.js
      #            (CalMatters for CA, state-specific investigative outlets for
      #            all others, Ballotpedia state overview as fallback).
      # Both outputs are fed into politicians:import-election-results which
      # updates term_status to 'seated' (won) or 'lost' on matched records.
      - name: Scrape Ballotpedia election results (statewide, direct strategy)
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATES="${{ github.event.inputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            FIRST_STATE=$(echo "$STATES" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST_STATE"
          fi
          # --strategy=direct constructs per-state race URLs directly:
          #   https://ballotpedia.org/{StateName}_gubernatorial_election,_{YEAR}
          # etc. — covers all 50 states without depending on the index page.
          node scripts/scrape-ballotpedia.js \
            --office=statewide \
            --strategy=direct \
            --year="$YEAR" \
            --results \
            $STATE_ARG \
            --out=storage/app/imports/ballotpedia-results-${YEAR}.json

      - name: Import Ballotpedia election results
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          CREATE_ARG=""
          if [ "${{ github.event.inputs.create_missing }}" = "true" ]; then
            CREATE_ARG="--create-missing"
          fi
          php artisan politicians:import-election-results \
            --file=storage/app/imports/ballotpedia-results-${YEAR}.json \
            $CREATE_ARG \
            ${{ steps.args.outputs.dry_arg }}

      - name: Scrape 50-state local voter guides
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATES="${{ github.event.inputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            STATE_ARG="--states=$STATES"
          fi
          # --cache-hours=2160 skips re-scraping if the output JSON is less than
          # 3 months (90 days) old.  Voter guide content is stable between
          # election cycles so there is no value in hitting 50 state sites
          # every week.  To force a full refresh, dispatch manually and pass
          # --cache-hours=0 (or delete the output file on the runner).
          node scripts/scrape-state-voter-guides.js \
            --year="$YEAR" \
            $STATE_ARG \
            --cache-hours=2160 \
            --out=storage/app/imports/state-voter-guides-${YEAR}.json

      - name: Import local voter guide results
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          CREATE_ARG=""
          if [ "${{ github.event.inputs.create_missing }}" = "true" ]; then
            CREATE_ARG="--create-missing"
          fi
          # --skip-fresh-days=7 skips DB writes for records whose result_status
          # is already final (seated/lost) and were updated within the last 7
          # days.  Prevents redundant overwrites on weekly runs.
          php artisan politicians:import-election-results \
            --file=storage/app/imports/state-voter-guides-${YEAR}.json \
            --skip-fresh-days=7 \
            $CREATE_ARG \
            ${{ steps.args.outputs.dry_arg }}
