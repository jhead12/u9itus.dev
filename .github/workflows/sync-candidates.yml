name: Sync Candidates

# Runs weekly (Sunday 02:00 UTC) and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 2 * * *"   # Every day at 02:00 UTC
  workflow_dispatch:
    inputs:
      state:
        description: "Single state to sync/enrich (e.g. CA). Used when 'states' is blank."
        type: choice
        default: ""
        required: false
        options:
          - ""
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DE
          - FL
          - GA
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - OH
          - OK
          - OR
          - PA
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - VT
          - VA
          - WA
          - WV
          - WI
          - WY
          - DC
      states:
        description: "Comma-separated state codes to sync (e.g. CA,TX,NY). Leave blank for all states."
        default: ""
        required: false
      include_former:
        description: "Include politicians whose latest term has ended"
        type: boolean
        default: false
      dry_run:
        description: "Dry-run (report only, no DB writes)"
        type: boolean
        default: false
      election_year:
        description: "Election year to target for result scraping (default: 2026)"
        default: "2026"
        required: false
      include_results:
        description: "Also scrape election results (winner/loser) from Ballotpedia + local sites"
        type: boolean
        default: true
      create_missing:
        description: "Create new unclaimed profiles for candidates not yet in the DB"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-federal-candidates:
    name: Sync federal candidates from congress-legislators
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ── PHP ─────────────────────────────────────────────────────────────────
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      # ── Composer ────────────────────────────────────────────────────────────
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      # ── Laravel env ─────────────────────────────────────────────────────────
      # Required secrets: APP_KEY, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
      # Optional secrets: STRIPE_SECRET, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY
      - name: Write .env
        run: |
          cat > .env <<EOF
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=sync
          LOG_CHANNEL=stderr

          STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}
          STRIPE_KEY=${{ secrets.STRIPE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF

      # ── Migrations ───────────────────────────────────────────────────────────
      - name: Run pending migrations
        run: php artisan migrate --force --no-interaction

      # ── Build state filter args ──────────────────────────────────────────────
      - name: Build import arguments
        id: args
        run: |
          STATES_INPUT="${{ github.event.inputs.states }}"
          STATE_PICKER="${{ github.event.inputs.state }}"
          STATES="$STATES_INPUT"
          if [ -z "$STATES" ] && [ -n "$STATE_PICKER" ]; then
            STATES="$STATE_PICKER"
          fi
          STATE_ARGS=""
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              STATE_ARGS="$STATE_ARGS --state=$state"
            done
          fi

          FORMER_ARG=""
          if [ "${{ github.event.inputs.include_former }}" = "true" ]; then
            FORMER_ARG="--include-former"
          fi

          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          RUN_CA="false"
          if [ -z "$STATES" ]; then
            # No filter means "all states", so include the CA-specific pass.
            RUN_CA="true"
          else
            for state in $(echo "$STATES" | tr ',' ' '); do
              if [ "$state" = "CA" ]; then
                RUN_CA="true"
                break
              fi
            done
          fi

          echo "state_args=$STATE_ARGS" >> $GITHUB_OUTPUT
          echo "states=$STATES" >> $GITHUB_OUTPUT
          echo "run_ca=$RUN_CA" >> $GITHUB_OUTPUT
          echo "former_arg=$FORMER_ARG" >> $GITHUB_OUTPUT
          echo "dry_arg=$DRY_ARG" >> $GITHUB_OUTPUT

      # ── Sync current federal legislators ─────────────────────────────────────
      - name: Sync current federal legislators
        run: |
          php artisan politicians:import-unclaimed-us \
            --fetcher=current \
            ${{ steps.args.outputs.state_args }} \
            ${{ steps.args.outputs.former_arg }} \
            ${{ steps.args.outputs.dry_arg }}

      # ── Sync California-specific federal profiles ─────────────────────────────
      - name: Sync California federal profiles (dedicated command)
        if: ${{ steps.args.outputs.run_ca == 'true' }}
        run: |
          php artisan politicians:import-unclaimed-ca \
            ${{ steps.args.outputs.dry_arg }}

      # ── Scrape & import 2026 primary candidates from Ballotpedia ─────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Verify Playwright installation
        run: node -e "import('playwright').then(m => console.log('playwright OK:', Object.keys(m)))"

      # ── Statewide offices (direct strategy: constructs per-state URLs) ──────
      # Uses --strategy=direct so every state's race page is visited directly:
      #   https://ballotpedia.org/{StateName}_gubernatorial_election,_{year}
      #   https://ballotpedia.org/{StateName}_attorney_general_election,_{year}
      #   https://ballotpedia.org/{StateName}_lieutenant_gubernatorial_election,_{year}
      #   ... etc.
      # This is more reliable than the index approach — guaranteed to attempt
      # all 50 states regardless of whether Ballotpedia's index page lists them.
      - name: Scrape Ballotpedia statewide candidates (all 50 states, direct)
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATE_ARG=""
          if [ -n "${{ steps.args.outputs.states }}" ]; then
            # single-state runs pass the first state only (direct mode takes --state)
            FIRST_STATE=$(echo "${{ steps.args.outputs.states }}" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST_STATE"
          fi
          # --fetch-websites visits each candidate's Ballotpedia profile page to
          # extract their campaign website URL and a short bio excerpt.
          # This adds ~1 extra HTTP request per candidate but is the only way to
          # get the actual campaign site (not just the Ballotpedia profile link).
          node scripts/scrape-ballotpedia.js \
            --office=statewide \
            --strategy=direct \
            --year="$YEAR" \
            --results \
            --fetch-websites \
            $STATE_ARG \
            --out=storage/app/imports/ballotpedia-statewide-${YEAR}.json

      - name: Import statewide candidates
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          # --election-year ensures cross-office ECR rows get the correct election_date.
          # The importer now detects seated politicians running for a different office
          # (e.g. Lt. Governor running for Governor) and writes to ECR only — it never
          # overwrites their seated term_status on the Politician row.
          php artisan politicians:import-ballotpedia \
            --file=storage/app/imports/ballotpedia-statewide-${YEAR}.json \
            --election-year=${YEAR} \
            ${{ steps.args.outputs.dry_arg }}

      # ── U.S. House races (widget strategy: one page per state covers every
      #    district in a single request) ─────────────────────────────────────
      # The old --strategy=index relied on Ballotpedia's central House index page
      # linking to all 435 district race pages. That index is frequently
      # incomplete/lagging, so districts not yet linked there were silently
      # skipped — the root cause of missing House candidates. The widget
      # strategy visits each state's "Elections in {State}, {year}" overview
      # page and parses its full offices table, so every district is captured
      # regardless of whether the central index has been updated.
      - name: Scrape Ballotpedia U.S. House candidates
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          node scripts/scrape-ballotpedia.js \
            --office=house \
            --strategy=widget \
            --year="$YEAR" \
            --fetch-websites \
            ${{ steps.args.outputs.state_args }} \
            --out=storage/app/imports/ballotpedia-house-${YEAR}.json

      - name: Import U.S. House candidates
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          php artisan politicians:import-ballotpedia \
            --file=storage/app/imports/ballotpedia-house-${YEAR}.json \
            ${{ steps.args.outputs.dry_arg }}

      # ── OpenSecrets district finance data ─────────────────────────────────
      # Scrapes each congressional district's OpenSecrets race page to capture
      # per-candidate fundraising totals (raised, spent, cash on hand) and
      # incumbent flags. One request per district covers all candidates.
      - name: Scrape OpenSecrets district finance data
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          # Strip any trailing commas from the states input before building the
          # --states option. A bare "IL," (trailing comma) was being passed as a
          # positional argument by the shell, causing:
          #   RuntimeException: No arguments expected for "opensecrets:scrape-districts"
          STATES=$(echo "${{ steps.args.outputs.states }}" | sed 's/,*$//')
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            STATE_ARG="--states=${STATES}"
          fi
          php artisan opensecrets:scrape-districts \
            --year="$YEAR" \
            ${STATE_ARG} \
            ${{ steps.args.outputs.dry_arg }}

      # ── Sync Census Bureau population data ───────────────────────────────
      # Upserts state + congressional-district populations from the
      # 2020 Decennial Census P.L. 94-171 redistricting file (free API,
      # no key required). Run in dry-run mode when the workflow is dry-run.
      - name: Sync Census population data
        env:
          CENSUS_DATA_API: ${{ secrets.CENSUS_DATA_API }}
        run: |
          php artisan geo:sync-census-population \
            --year=2020 \
            --level=all \
            ${{ steps.args.outputs.dry_arg }}

      # ── AI-enriched statewide officeholder data ──────────────────────────
      # Three-tier pipeline: Ballotpedia → Wikipedia → Claude (if key set).
      # Syncs current governor, lt. governor, attorney general, treasurer,
      # and secretary of state for every state (or the filtered subset).
      # --clean removes unverified statewide records not matched by enrichment
      # (eliminates garbage scraper rows like "Linda Martinez").
      - name: Enrich statewide officeholders
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STATES="${{ steps.args.outputs.states }}"
          DRY="${{ steps.args.outputs.dry_arg }}"
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              echo "=== Enriching statewide offices for $state ==="
              php artisan politicians:enrich-statewide \
                --scope=statewide \
                --state="$state" \
                --clean \
                $DRY
            done
          else
            php artisan politicians:enrich-statewide \
              --scope=statewide \
              --clean \
              $DRY
          fi

      # ── AI-enriched city mayor data (all 50 states + DC) ─────────────────
      # Same three-tier pipeline as statewide enrichment but targeting the
      # primary city mayor for each state using Wikipedia office pages like
      # "Mayor_of_Los_Angeles", "Mayor_of_New_York_City",
      # "Mayor_of_the_District_of_Columbia", etc.
      # DC is handled here (no Governor) — mayor is its chief executive.
      # --clean removes unverified City-level records not matched this run.
      - name: Enrich city mayors (all states + DC)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STATES="${{ steps.args.outputs.states }}"
          DRY="${{ steps.args.outputs.dry_arg }}"
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              echo "=== Enriching mayor for $state ==="
              php artisan politicians:enrich-statewide \
                --scope=mayors \
                --state="$state" \
                --clean \
                $DRY
            done
          else
            php artisan politicians:enrich-statewide \
              --scope=mayors \
              --clean \
              $DRY
          fi

      # ── Backfill profile photos (Wikipedia pageimages API) ───────────────
      # For every unclaimed politician still missing a profile_photo_url,
      # queries the Wikipedia pageimages API by name and writes the thumbnail
      # URL back to the DB.  No API key required.  Runs after enrichment so
      # newly upserted governors / mayors / AGs are included in this pass.
      # --limit=1000 caps the run at 1 000 politicians per weekly sync; any
      # remaining gaps are picked up on the next scheduled run.
      - name: Backfill profile photos from Wikipedia
        run: |
          STATES="${{ steps.args.outputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            FIRST_STATE=$(echo "$STATES" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST_STATE"
          fi
          if php artisan list --raw | grep -qE '^politicians:backfill-photos([[:space:]]|$)'; then
            php artisan politicians:backfill-photos \
              --limit=1000 \
              $STATE_ARG \
              ${{ steps.args.outputs.dry_arg }}
          else
            echo "WARNING: politicians:backfill-photos is unavailable for this run SHA; skipping photo backfill step."
          fi

      # ── Validate profile photos (face vs logo/symbol) ─────────────────────
      # Ensures profile_photo_url points to a likely headshot. Uses Anthropic
      # vision classification and quarantines likely non-face images
      # (e.g. logos, seals, flags) for review. Limited per run for predictable CI cost.
      - name: Validate profile photos are face images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STATES="${{ steps.args.outputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            FIRST_STATE=$(echo "$STATES" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST_STATE"
          fi
          # --require-ai omitted: quota exhaustion opens the circuit breaker
          # automatically and finishes remaining photos with URL heuristics.
          # --limit=150 keeps daily AI usage conservative (~150 images/day).
          php artisan politicians:validate-profile-photos \
            --quarantine-only \
            --min-confidence=0.70 \
            --limit=150 \
            ${STATE_ARG} \
            ${{ steps.args.outputs.dry_arg }}

      # ── Sync primary election results ────────────────────────────────────
      # For each statewide candidate whose election_date is in the past,
      # scrapes Ballotpedia/Wikipedia to determine if they advanced to the
      # general or were eliminated. Stamps payload.primary_result.
      # Eliminated candidates are then hidden from the map API automatically.
      # --force re-checks records that already have primary_result set,
      # ensuring corrections (e.g. Chad Bianco eliminated → not advanced)
      # are picked up on every weekly run.
      - name: Sync primary results
        run: |
          STATES="${{ steps.args.outputs.states }}"
          DRY="${{ steps.args.outputs.dry_arg }}"
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              echo "=== Syncing primary results for $state ==="
              php artisan politicians:sync-primary-results \
                --state="$state" \
                --force \
                $DRY
            done
          else
            php artisan politicians:sync-primary-results --force $DRY
          fi

      # ── Reconcile lifecycle status ────────────────────────────────────────
      # Marks seated members, retires former members, and clears stale
      # is_running_candidate flags after an election date has passed.
      - name: Reconcile politician status
        run: |
          php artisan politicians:reconcile-status \
            ${{ steps.args.outputs.dry_arg }}

      # ── Normalize stale district formats ──────────────────────────────────
      # Converts any lingering "FULLSTATENAME-NN" district values (e.g.
      # "CALIFORNIA-29") to the canonical "ST-NN" format (e.g. "CA-29").
      # These can appear from legacy imports or third-party data sources that
      # stored the full state name instead of the 2-letter abbreviation.
      # Safe to run every sync — no-ops when all records are already clean.
      - name: Normalize district format
        run: |
          php artisan politicians:normalize-district-format \
            ${{ steps.args.outputs.dry_arg }}

      # ── Clean cross-office ECR conflicts ──────────────────────────────────
      # Stamps primary_result=eliminated on ECR rows where the matched
      # politician is already seated in a DIFFERENT office.
      # Runs after reconcile-status so term_status values are fresh.
      - name: Clean cross-office ECR conflicts (statewide)
        run: |
          php artisan politicians:clean-cross-office-ecrs \
            --scope=state \
            ${{ steps.args.outputs.state_args }} \
            ${{ steps.args.outputs.dry_arg }}

      - name: Clean cross-office ECR conflicts (federal/house)
        run: |
          php artisan politicians:clean-cross-office-ecrs \
            --scope=all \
            ${{ steps.args.outputs.state_args }} \
            ${{ steps.args.outputs.dry_arg }}

      # ── Cross-office conflict audit ───────────────────────────────────────
      # Detects politicians whose term_status=seated but who also appear as a
      # candidate for a DIFFERENT office in election_candidate_records.
      # This catches issues like "Lt. Governor listed under Governor" across
      # all 50 states before they hit the public map.
      # Exits 0 always — this is a warning step, not a blocker.
      - name: Audit cross-office conflicts
        run: |
          php artisan tinker --execute="
            \$conflicts = \Illuminate\Support\Facades\DB::select(\"
              SELECT p.id, p.full_name, p.state, p.political_office AS seated_office,
                     e.political_office AS candidate_office, e.id AS ecr_id
              FROM politicians p
              JOIN election_candidate_records e
                ON LOWER(e.full_name) = LOWER(p.full_name)
               AND UPPER(COALESCE(e.state,'')) = UPPER(COALESCE(p.state,''))
               AND LOWER(COALESCE(e.political_office,'')) != LOWER(COALESCE(p.political_office,''))
              WHERE p.term_status IN ('seated','current')
                AND COALESCE(JSON_UNQUOTE(JSON_EXTRACT(e.payload,'$.primary_result')),'') != 'eliminated'
              ORDER BY p.state, p.full_name
            \");
            if (count(\$conflicts) === 0) {
              echo 'No cross-office conflicts found.' . PHP_EOL;
            } else {
              echo '⚠ CROSS-OFFICE CONFLICTS (' . count(\$conflicts) . '):' . PHP_EOL;
              foreach (\$conflicts as \$c) {
                echo '  [' . \$c->state . '] ' . \$c->full_name . ' — seated: ' . \$c->seated_office . ' | running-for: ' . \$c->candidate_office . PHP_EOL;
              }
            }
          " || true

      # ── Election results & local voter guides (all 50 states) ────────────
      # Two-pass results enrichment:
      #  Pass 1 — Re-scrape Ballotpedia with --results to capture winner/loser
      #            flags from the same pages already visited for candidates.
      #  Pass 2 — Scrape per-state local voter guide / news sites using the
      #            50-state map in scripts/scrape-state-voter-guides.js
      #            (CalMatters for CA, state-specific investigative outlets for
      #            all others, Ballotpedia state overview as fallback).
      # Both outputs are fed into politicians:import-election-results which
      # updates term_status to 'seated' (won) or 'lost' on matched records.
      - name: Scrape Ballotpedia election results (statewide, direct strategy)
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATES="${{ steps.args.outputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            FIRST_STATE=$(echo "$STATES" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST_STATE"
          fi
          # --strategy=direct constructs per-state race URLs directly:
          #   https://ballotpedia.org/{StateName}_gubernatorial_election,_{YEAR}
          # etc. — covers all 50 states without depending on the index page.
          node scripts/scrape-ballotpedia.js \
            --office=statewide \
            --strategy=direct \
            --year="$YEAR" \
            --results \
            $STATE_ARG \
            --out=storage/app/imports/ballotpedia-results-${YEAR}.json

      - name: Import Ballotpedia election results
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          # --create-missing is always on for results imports: winners like
          # Xavier Becerra / Steve Hilton may not be in election_candidate_records
          # yet (they weren't scraped as candidates before the primary), so we
          # create them here with result_status='won' → primary_result='advanced_to_general'.
          php artisan politicians:import-election-results \
            --file=storage/app/imports/ballotpedia-results-${YEAR}.json \
            --create-missing \
            ${{ steps.args.outputs.dry_arg }}

      - name: Scrape 50-state local voter guides
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATES="${{ steps.args.outputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            STATE_ARG="--states=$STATES"
          fi
          # --cache-hours=2160 skips re-scraping if the output JSON is less than
          # 3 months (90 days) old.  Voter guide content is stable between
          # election cycles so there is no value in hitting 50 state sites
          # every week.  To force a full refresh, dispatch manually and pass
          # --cache-hours=0 (or delete the output file on the runner).
          node scripts/scrape-state-voter-guides.js \
            --year="$YEAR" \
            $STATE_ARG \
            --cache-hours=2160 \
            --out=storage/app/imports/state-voter-guides-${YEAR}.json

      - name: Import local voter guide results
        if: ${{ github.event.inputs.include_results != 'false' }}
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          CREATE_ARG=""
          if [ "${{ github.event.inputs.create_missing }}" = "true" ]; then
            CREATE_ARG="--create-missing"
          fi
          # --skip-fresh-days=7 skips DB writes for records whose result_status
          # is already final (seated/lost) and were updated within the last 7
          # days.  Prevents redundant overwrites on weekly runs.
          php artisan politicians:import-election-results \
            --file=storage/app/imports/state-voter-guides-${YEAR}.json \
            --skip-fresh-days=7 \
            $CREATE_ARG \
            ${{ steps.args.outputs.dry_arg }}

      # ── Reconcile missing profiles from election candidate records ───────
      # Creates unclaimed profiles for election_candidate_records that still
      # have no linked politician, then writes candidate_identity_links so
      # future runs stay idempotent. This catches gaps where records were
      # imported but no profile row exists yet.
      - name: Reconcile missing unclaimed candidate profiles
        run: |
          YEAR="${{ github.event.inputs.election_year || '2026' }}"
          STATES="${{ steps.args.outputs.states }}"
          STATE_ARGS=""
          if [ -n "$STATES" ]; then
            for state in $(echo "$STATES" | tr ',' ' '); do
              STATE_ARGS="$STATE_ARGS --state=$state"
            done
          fi

          php artisan politicians:reconcile-missing-profiles \
            --election-year="$YEAR" \
            --limit=1000 \
            $STATE_ARGS \
            ${{ steps.args.outputs.dry_arg }}

      # ── Data-integrity audit ──────────────────────────────────────────────
      # Scans politician rows against PoliticianDataRules: bad names, unknown
      # parties, invalid state codes, unknown term_status values.
      # --fix normalises party/state in place (safe, non-destructive).
      # --deactivate hides artifact-name rows (garbage AI output) so they
      # never surface on the public map or profile pages.
      # Exits 0 always — this is a warning step, not a blocker.
      - name: Audit & fix politician data integrity
        run: |
          STATES="${{ steps.args.outputs.states }}"
          STATE_ARG=""
          if [ -n "$STATES" ]; then
            FIRST=$(echo "$STATES" | cut -d',' -f1)
            STATE_ARG="--state=$FIRST"
          fi
          php artisan politicians:audit-data-integrity \
            --fix \
            --deactivate \
            --limit=5000 \
            $STATE_ARG \
            ${{ steps.args.outputs.dry_arg }} || true
