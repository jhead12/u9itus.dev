name: One-off - Fix Swalwell/Hilton duplicate reviews

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply — delete wrong-direction reviews and re-enqueue corrected ones"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fix:
    name: Cleanup misordered reviews and re-run dedupe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up app
        uses: ./.github/actions/setup-app
        with:
          app_key: ${{ secrets.APP_KEY }}
          app_url: ${{ secrets.APP_URL }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_username: ${{ secrets.DB_USERNAME }}
          db_password: ${{ secrets.DB_PASSWORD }}

      - name: Delete wrong-direction pending merge reviews
        run: |
          APPLY_ARG=""
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            APPLY_ARG="--apply"
          fi
          php artisan politicians:cleanup-misordered-merge-reviews $APPLY_ARG

      - name: Re-run dedupe to regenerate corrected reviews
        if: github.event.inputs.apply == 'true'
        run: |
          php artisan politicians:dedupe --scope=unclaimed-all --enqueue-review
          php artisan politicians:dedupe --scope=federal --enqueue-review
