name: One-off - Remediate 2026-09-11 Name Corruption

# Runs politicians:remediate-name-corruption-2026-09-11 — restores the 10
# real names wrongly stripped by the first production run of
# politicians:cleanup-workflow, and deactivates the 86 "Party" placeholder
# rows that collapsed from "Democratic Party"/"Republican Party". See that
# command's docblock for full context. Manual-only, no schedule — delete
# this workflow (and the command) once it's been run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run — report only, no DB writes"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remediate:
    name: Run one-off remediation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up app
        uses: ./.github/actions/setup-app
        with:
          app_key: ${{ secrets.APP_KEY }}
          app_url: ${{ secrets.APP_URL }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_username: ${{ secrets.DB_USERNAME }}
          db_password: ${{ secrets.DB_PASSWORD }}

      - name: Run remediation
        run: |
          APPLY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            APPLY_ARG="--apply"
          fi
          php artisan politicians:remediate-name-corruption-2026-09-11 $APPLY_ARG
