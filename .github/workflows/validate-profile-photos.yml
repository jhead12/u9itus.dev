name: Validate Candidate Profile Photos

on:
  schedule:
    - cron: "30 3 * * *"   # Daily at 03:30 UTC
  workflow_dispatch:
    inputs:
      state:
        description: "Optional single state code (e.g. CA)"
        default: ""
        required: false
      limit:
        description: "Max politicians to validate"
        default: "800"
        required: false
      include_claimed:
        description: "Also validate claimed profiles"
        type: boolean
        default: false
      fix_invalid:
        description: "Enable auto-clear mode (otherwise quarantine-first only)"
        type: boolean
        default: false
      dry_run:
        description: "Report only, no DB writes"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-profile-photos:
    name: Validate profile photos are face images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up app
        uses: ./.github/actions/setup-app
        with:
          app_key: ${{ secrets.APP_KEY }}
          app_url: ${{ secrets.APP_URL }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT }}
          db_database: ${{ secrets.DB_DATABASE }}
          db_username: ${{ secrets.DB_USERNAME }}
          db_password: ${{ secrets.DB_PASSWORD }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Validate profile photos
        run: |
          STATE="${{ github.event.inputs.state }}"
          LIMIT="${{ github.event.inputs.limit || '800' }}"
          INCLUDE_CLAIMED="${{ github.event.inputs.include_claimed == 'true' && '--include-claimed' || '' }}"
          AUTO_CLEAR="${{ github.event.inputs.fix_invalid == 'true' && '--auto-clear --fix-invalid' || '' }}"
          DRY="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          STATE_ARG=""
          if [ -n "$STATE" ]; then
            STATE_ARG="--state=${STATE}"
          fi

          php artisan politicians:validate-profile-photos \
            --require-ai \
            --quarantine-only \
            --min-confidence=0.70 \
            --limit="${LIMIT}" \
            ${STATE_ARG} \
            ${INCLUDE_CLAIMED} \
            ${AUTO_CLEAR} \
            ${DRY}
