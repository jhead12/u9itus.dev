name: 'Set up Node + Playwright'
description: 'Node.js, npm ci, Playwright Chromium — shared by workflows that drive a browser scrape/crawl.'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "npm"

    - name: Install Node dependencies
      shell: bash
      run: npm ci
      env:
        NODE_ENV: development

    - name: Install Playwright Chromium
      shell: bash
      run: npx playwright install chromium --with-deps
