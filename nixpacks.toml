[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.curl', 'php82Extensions.zip', 'php82Extensions.bcmath', 'php82Extensions.tokenizer', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --optimize-autoloader --no-dev --no-interaction --ignore-platform-reqs']

[phases.build]
cmds = ['php artisan config:clear || true', 'php artisan route:clear || true']

[start]
cmd = 'chmod +x wait-for-db.sh && ./wait-for-db.sh && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
