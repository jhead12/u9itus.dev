; php-fpm pool for the web role (loaded after the image's www.conf/zz-docker.conf).
[www]
; Railway passes all configuration as environment variables; php-fpm hides
; them from PHP unless clear_env is off.
clear_env = no

; Runs as root, like `php artisan serve` did, so files written by the web
; process and by `php artisan ...` in a shell never lock each other out of
; storage/. Started with `php-fpm -R`.
user = root
group = root

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
; Recycle workers now and then so slow memory growth can't accumulate.
pm.max_requests = 500

request_terminate_timeout = 300s

; Send PHP/Laravel stderr (LOG_CHANNEL=stderr) to the container logs.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
