; Keep compiled PHP in memory between requests (web role; the CLI is unaffected).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
; Code only changes on deploy, but compiled Blade views are rewritten at
; runtime, so keep checking timestamps (cheaply, every 2s).
opcache.validate_timestamps=1
opcache.revalidate_freq=2
